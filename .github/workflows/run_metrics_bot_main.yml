name: Run Metrics Bot on Main Every 5 Minutes

on:
  schedule:
    - cron: "*/5 * * * *"  # Every 5 minutes UTC
  workflow_dispatch:

jobs:
  run-metrics-bot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GROUP_CHAT_ID: ${{ secrets.GROUP_CHAT_ID }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      REPO: ${{ secrets.REPO }}
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      TOKEN_ADDRESS: ${{ secrets.TOKEN_ADDRESS }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run metrics bot
        run: python metrics_bot.py

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit & push changes
        run: |
          git add .
          git diff --cached --quiet || git commit -m "Update metrics"
          git push
